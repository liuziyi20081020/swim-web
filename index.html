<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swim Tracker | 游泳記錄網站</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&amp;family=Noto+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <header>
    <h1>SWIM TRACKER</h1>
    <p class="slogan">Swim. Track. Improve.</p>
    <button id="darkLightBtn" class="dark-light"><i class="fa-solid fa-sun"></i></button>
    <nav class="nav">
      <button id="train" class="big-btn">新增訓練紀錄</button>
      <button id="bestScore" class="big-btn">查看最佳紀錄</button>
      <button id="week" class="big-btn">查看一周紀錄</button>
      <button id="calander" class="big-btn">查看行事曆</button>
      <button id="menu" class="big-btn">客製化菜單</button>
    </nav>
  </header>

  <main>
    <section id="trainPage" class="page">
      <button type="button" class="back-btn">回首頁</button>
      <form class="swimForm">
        <div class="form-group">
          <div>
            <label for="date">訓練日期: </label>
            <input type="date" id="date" class="trainInput" required>
          </div>
        
          <fieldset class="style">
            <legend>距離(m): </legend>
            <label>蝶式: <input type="number" id="butterfly" class="trainInput"></label>
            <label>仰式: <input type="number" id="backstroke" class="trainInput"></label>
            <label>蛙式: <input type="number" id="breaststroke" class="trainInput"></label>
            <label>自由式: <input type="number" id="freestyle" class="trainInput"></label>
          </fieldset>

          <div class="totalDis">
            <span id="totalDis">0</span>公尺
          </div>

          <div class="duration">
            <label> 花費時間: </label>
            <input type="number" id="duraitonM" class="trainInput" placeholder="分" required>
            <input type="number" id="duraitonS" class="trainInput" placeholder="秒" required>
          </div>

          <div class="note">
            <label for="notes">備註: </label>
            <textarea id="notes" class="trainInput" placeholder="在這裡輸入..."></textarea> 
          </div>
          <button type="button" id="submit" class="submit-btn">紀錄</button>
        </div>
      </form>
    </section>


    <section id= "bestScorePage" class="page">

    </section>


     <section id= "weekPage" class="page">

    </section>


     <section id= "calanderPage" class="page">

    </section>


     <section id= "menuPage" class="page">

    </section>




  </main>





  <script src="training.js"></script>
</body>
</html>
