<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swim Tracker | 游泳記錄網站</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&amp;family=Noto+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <header>
    <h1>SWIM TRACKER</h1>
    <p class="slogan">Swim. Track. Improve.</p>
    <nav class="nav">
      <button id="train" class="big-btn">新增訓練紀錄</button>
      <button id="bestScore" class="big-btn">查看最佳紀錄</button>
      <button id="week" class="big-btn">查看一周紀錄</button>
      <button id="calander" class="big-btn">查看行事曆</button>
    </nav>
  </header>

  <main>
    <section id="trainPage" class="page">
      <button type="button" class="back-btn">回首頁</button>
      <form class="swimForm" id="swimForm">
        <div class="form-group">
          <div>
            <label for="date">訓練日期: </label>
            <input type="date" id="date" class="trainInput" required>
          </div>
        
          <fieldset class="style">
            <legend>距離(m): </legend>
            <label>蝶式: <input type="number" id="butterfly" class="trainInput" list="dis-option"></label>
            <label>仰式: <input type="number" id="backstroke" class="trainInput" list="dis-option"></label>
            <label>蛙式: <input type="number" id="breaststroke" class="trainInput" list="dis-option"></label>
            <label>自由式: <input type="number" id="freestyle" class="trainInput" list="dis-option"></label>
          </fieldset>

          <datalist id="dis-option">
            <option value="50"></option>
            <option value="100"></option>
            <option value="200"></option>

          </datalist>

          <div class="totalDis">
            <span class="disText"><span id="totalDis">0</span>公尺</span>
          </div>

          <div class="duration">
            <label> 花費時間: </label>
            <input type="number" id="duraitonM" class="trainInput" placeholder="分" required>
            <input type="number" id="duraitonS" class="trainInput" placeholder="秒" required>
          </div>

          <div class="note">
            <label for="notes">備註: </label>
            <textarea id="notes" class="trainInput" placeholder="在這裡輸入..."></textarea> 
          </div>
          <button type="submit" id="submit" class="submit-btn">紀錄</button>
        </div>
      </form>

      <div id="successMsg" class="success-msg" style="display: none;">
        <p>紀錄成功! 點擊下方按鈕查看</p>
        <div class="success-acts">
          <button id="goWeek" class="form-go-btn" data-target="week">前往一周紀錄</button>
          <button id="goCalandar" class="form-go-btn" data-target="calandar">前往行事曆</button>
        </div>
      </div>
    </section>


    <section id="bestScorePage" class="page">
      <button type="button" class="back-btn">回首頁</button>
      
      <div id="best" class="best">
        <h1>歷史之最</h1>
        
        <div class="bestRecord">
          <div class="record-card">
            <h2>50公尺最快: </h2>
            <p class="record-time" id="best50Time">--分--秒</p>
            <p class="date">達成日期：<span id="best50Date">尚未有紀錄</span></p>
          </div>

          <div class="record-card">
            <h2>100公尺最快: </h2>
            <p class="record-time" id="best100Time">--分--秒</p>
            <p class="date">達成日期：<span id="best100Date">尚未有紀錄</span></p>
          </div>

          <div class="record-card">
            <h2>200公尺最快: </h2>
            <p class="record-time" id="best200Time">--分--秒</p>
            <p class="date">達成日期：<span id="best200Date">尚未有紀錄</span></p>
          </div>

          <div class="record-card highlight">
            <h2>最遠游泳距離: </h2>
            <p class="record-dis" id="bestDis">0 公尺</p>
            <p class="date">達成日期：<span id="bestDisDate">尚未有紀錄</span></p>
          </div>
        </div>
      </div>
    </section>


    <section id="weekPage" class="page">
      <button type="button" class="back-btn">回首頁</button>
            
        <div class="week-container">
          <h1>近七日訓練紀錄</h1>
              <!-- js -->
          <div id="weekRecordsList" class="week-records-list">
              <!-- js -->
          </div>
        </div>
    </section>


     <section id= "calanderPage" class="page">
      <button type="button" class="back-btn">回首頁</button>

      <div class="calendar-container">
        <div class="calendar-header">
          <button id="prevMonthBtn" type="button">&lt;</button>
          <h2 id="calendarMonthYear">2026 年 9 月</h2>
          <button id="nextMonthBtn" type="button">&gt;</button>
        </div>

        <div class="calendar-weekdays">
          <div>日</div>
          <div>一</div>
          <div>二</div>
          <div>三</div>
          <div>四</div>
          <div>五</div>
          <div>六</div>
        </div>

        <div id="calendarDays" class="calendar-days"></div>
      </div>

      <div id="dayDetailModal" class="modal" style="display: none;">
        <div class="modal-content">
          <span id="closeModal" class="close-btn">&times;</span>
          <h3 id="modalDate">訓練紀錄</h3>
          <div id="modalBody"></div>
        </div>
      </div>

    </section>

    




  </main>
  <footer class="site-footer">&copy 2026 劉子翊</footer>





  <script src="training.js"></script>
  <script src="best.js"></script>
  <script src="week.js"></script>
  <script src="calandar.js"></script>

</body>
</html>
